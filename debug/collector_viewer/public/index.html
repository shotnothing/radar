<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar Collector Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Radar Debug</p>
          <h1>Collector Timeline</h1>
        </div>
        <div class="summary" aria-live="polite">
          <div>
            <span id="event-count">0</span>
            <small>events</small>
          </div>
          <div>
            <span id="collector-count">0</span>
            <small>collectors</small>
          </div>
        </div>
      </header>

      <section class="timeline-tools" aria-label="Timeline tools">
        <div id="legend" class="legend"></div>
        <button id="refresh" type="button">Refresh</button>
      </section>

      <section class="status-row">
        <div id="parse-errors" class="parse-errors"></div>
      </section>

      <section class="timeline-shell">
        <ol id="timeline" class="timeline" aria-live="polite"></ol>
        <div id="empty-state" class="empty-state" hidden>
          <h2>No collected data matched</h2>
          <p>Start a collector, point the server at another work folder, or relax the filters.</p>
        </div>
      </section>
    </main>

    <template id="event-template">
      <li class="event-card">
        <div class="rail">
          <span class="dot"></span>
          <span class="line"></span>
        </div>
        <article>
          <header class="event-header">
            <div>
              <time></time>
              <h2></h2>
            </div>
          </header>
          <p class="event-text"></p>
          <div class="event-footer">
            <span class="collector-pill"></span>
            <span class="event-kind"></span>
          </div>
        </article>
      </li>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
