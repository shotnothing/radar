<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar Collector Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Radar Debug</p>
          <h1>Collector Timeline</h1>
        </div>
        <div class="summary" aria-live="polite">
          <div>
            <span id="event-count">0</span>
            <small>events</small>
          </div>
          <div>
            <span id="collector-count">0</span>
            <small>collectors</small>
          </div>
        </div>
      </header>

      <section class="timeline-tools" aria-label="Timeline tools">
        <div id="legend" class="legend"></div>
        <button id="refresh" type="button">Refresh</button>
      </section>

      <section class="status-row">
        <div id="parse-errors" class="parse-errors"></div>
      </section>

      <section class="timeline-shell" aria-label="Collected event timeline">
        <div class="timeline-scroll">
          <ol id="timeline" class="timeline" aria-live="polite"></ol>
        </div>
        <button
          id="scroll-left"
          class="scroll-arrow scroll-arrow-left"
          type="button"
          aria-label="Scroll timeline left"
          hidden
        >
          ‹
        </button>
        <button
          id="scroll-right"
          class="scroll-arrow scroll-arrow-right"
          type="button"
          aria-label="Scroll timeline right"
          hidden
        >
          ›
        </button>
        <div id="empty-state" class="empty-state" hidden>
          <h2>No collected data matched</h2>
          <p>Start a collector, point the server at another work folder, or relax the filters.</p>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
